name: CI
on:
  pull_request:
    branches: [develop, main]
  workflow_dispatch:
jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: ruff check src tests
      - run: pytest -q
